name: "Build and publish the course"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: "Generated pages and links"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The committed pages are generated from outline.py and _src/. If someone edits a
      # fragment or an exercise without rebuilding, the published page silently goes stale.
      - name: "Generated files are up to date"
        run: python3 tools/build_docs.py --check

      - name: "Required entry points exist"
        run: |
          for f in index.html start/setup.html lessons/01-architecture.html lessons/03-roles-and-users.html \
                   lessons/04-privileges-and-grants.html lessons/02-databases-and-schemas.html \
                   appendices/d-glossary.html; do
            [ -f "$f" ] || { echo "missing entry point: $f" >&2; exit 1; }
          done

      # Fail the build rather than publish dead links or missing anchors.
      - name: "Verify links, anchors and assets"
        run: python3 tools/check_links.py .

